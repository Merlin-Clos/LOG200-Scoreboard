---
name: Release

permissions:
  contents: read

# Pousser un tag vX.Y.Z publie une release avec les binaires pour Linux, Windows et macOS.
# Lance a la main (workflow_dispatch), le workflow construit les archives sans publier.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Mac Intel, compile depuis le runner Apple Silicon : pas de tests.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin isolation-bot --bin isolation-referee --bin isolation-check

      - name: Package
        shell: bash
        run: |
          name="isolation-${{ matrix.target }}"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir "$name"
          for bin in isolation-bot isolation-referee isolation-check; do
            cp "target/${{ matrix.target }}/release/$bin$ext" "$name/"
          done
          cp README.md "$name/"
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: isolation-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
