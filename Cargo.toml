[package]
name = "isolation"
version = "0.1.0"
edition = "2024"
description = "Arbitre, bot et ladder pour le lab Isolation (LOG200)"
publish = false

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.release]
debug = 1

[[bin]]
name = "isolation-referee"
path = "src/bin/referee.rs"

[[bin]]
name = "isolation-bot"
path = "src/bin/bot.rs"

[[bin]]
name = "isolation-ladder"
path = "src/bin/ladder.rs"

[[bin]]
name = "isolation-check"
path = "src/bin/check.rs"
